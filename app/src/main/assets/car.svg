<?xml version="1.0" encoding="UTF-8"?>
<svg
    xmlns="http://www.w3.org/2000/svg"
    viewBox="0 0 500 300"
    preserveAspectRatio="xMidYMid meet"
    style="background: transparent;">

    <style>
        /* Ruedas girando */
        .wheel {
        transform-box: fill-box;
        transform-origin: center;
        animation: spin 1s linear infinite;
        }

        /* Carretera en movimiento */
        .road {
        animation: move 1s linear infinite;
        }

        @keyframes spin {
        0%   { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
        }

        @keyframes move {
        0%   { stroke-dashoffset: 0; }
        100% { stroke-dashoffset: -120; }
        }
    </style>

    <!-- RUEDA IZQUIERDA -->
    <ellipse
        class="wheel"
        cx="150"
        cy="220"
        rx="45"
        ry="45"
        fill="none"
        stroke="#FFFFFF"
        stroke-width="10" />

    <!-- RUEDA DERECHA -->
    <ellipse
        class="wheel"
        cx="350"
        cy="220"
        rx="45"
        ry="45"
        fill="none"
        stroke="#FFFFFF"
        stroke-width="10" />

    <!-- CUERPO DEL COCHE -->
    <path
        d="M80 220 L90 180 L160 180 L200 120 L350 120 L380 180 L420 180 L420 220"
        fill="none"
        stroke="#FFFFFF"
        stroke-width="10"
        stroke-linejoin="round" />

    <!-- TECHO -->
    <path
        d="M200 120 L240 80 L330 80 L350 120"
        fill="none"
        stroke="#FFFFFF"
        stroke-width="10"
        stroke-linejoin="round" />

    <!-- CARRETERA -->
    <line
        class="road"
        x1="50"
        y1="260"
        x2="450"
        y2="260"
        stroke="#FFFFFF"
        stroke-width="6"
        stroke-dasharray="20 40" />

</svg>
